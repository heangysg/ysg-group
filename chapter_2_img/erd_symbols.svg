<svg viewBox="-50 -50 900 500" width="900" height="500" xmlns="http://www.w3.org/2000/svg">
    <rect x="-50" y="-50" width="100%" height="100%" fill="#ffffff"/>
    <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#1e293b" text-anchor="middle">Entity Relationship Diagram (ERD) Symbols</text>

    <!-- Entity -->
    <rect x="50" y="100" width="140" height="70" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="120" y="145" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Entity</text>
    <text x="120" y="195" font-family="Khmer OS Content, Arial" font-size="14" fill="#475569" text-anchor="middle">អង្គភាព (តារាង)</text>

    <!-- Weak Entity -->
    <rect x="250" y="100" width="140" height="70" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <rect x="255" y="105" width="130" height="60" fill="none" stroke="#334155" stroke-width="2"/>
    <text x="320" y="145" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Weak Entity</text>
    <text x="320" y="195" font-family="Khmer OS Content, Arial" font-size="14" fill="#475569" text-anchor="middle">អង្គភាពខ្សោយ</text>

    <!-- Attribute -->
    <ellipse cx="500" cy="135" rx="60" ry="35" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="500" y="140" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Attribute</text>
    <text x="500" y="195" font-family="Khmer OS Content, Arial" font-size="14" fill="#475569" text-anchor="middle">គុណលក្ខណៈ</text>

    <!-- Key Attribute -->
    <ellipse cx="680" cy="135" rx="60" ry="35" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="680" y="140" font-family="Arial" font-size="16" font-weight="bold" text-decoration="underline" text-anchor="middle">Key Attribute</text>
    <text x="680" y="195" font-family="Khmer OS Content, Arial" font-size="14" fill="#475569" text-anchor="middle">គុណលក្ខណៈសោ</text>

    <!-- Relationship -->
    <polygon points="350,250 450,300 350,350 250,300" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="350" y="305" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Relationship</text>
    <text x="350" y="375" font-family="Khmer OS Content, Arial" font-size="14" fill="#475569" text-anchor="middle">ទំនាក់ទំនង</text>
</svg>
