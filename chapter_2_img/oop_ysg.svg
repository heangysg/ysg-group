<svg width="1000" height="600" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
    
  <style>
    text { font-family: 'Khmer OS Siemreap', Arial, sans-serif; fill: #000000; }
    .subtitle { font-size: 16px; fill: #333333; }
    .box { fill: #ffffff; stroke: #333333; stroke-width: 2; rx: 6; }
    .box-header { font-weight: bold; font-size: 18px; fill: #ffffff; }
    .arrow { stroke: #000000; stroke-width: 3; fill: none; }
    .arrow-head { fill: #000000; }
    .code { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #000000; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow-head" />
    </marker>
  </defs>

    <rect width="1000" height="600" fill="#ffffff" />

    <rect x="350" y="50" width="300" height="180" class="box" />
    <rect x="350" y="50" width="300" height="50" fill="#333333" rx="6" />
    <text x="500" y="82" text-anchor="middle" class="box-header">Class: Machine</text>
    <text x="380" y="130" class="code">+ Name (String)</text>
    <text x="380" y="160" class="code">+ Price (Float)</text>
    <path d="M 350 180 L 650 180" stroke="#cccccc" stroke-width="2" />
    <text x="380" y="210" class="code">+ updateStock()</text>

    <path d="M 500 230 L 500 290 L 250 290 L 250 330" class="arrow" marker-end="url(#arrowhead)" />
    <path d="M 500 230 L 500 290 L 750 290 L 750 330" class="arrow" marker-end="url(#arrowhead)" />

    <rect x="100" y="350" width="300" height="150" class="box" />
    <rect x="100" y="350" width="300" height="50" fill="#666666" rx="6" />
    <text x="250" y="382" text-anchor="middle" class="box-header">FoodMachine</text>
    <text x="130" y="430" class="code">+ foodType (String)</text>
    <text x="130" y="470" class="code">+ calculateTax()</text>

    <rect x="600" y="350" width="300" height="150" class="box" />
    <rect x="600" y="350" width="300" height="50" fill="#666666" rx="6" />
    <text x="750" y="382" text-anchor="middle" class="box-header">AgriculturalMachine</text>
    <text x="630" y="430" class="code">+ powerHP (Int)</text>
    <text x="630" y="470" class="code">+ calculateTax()</text>
  </svg>