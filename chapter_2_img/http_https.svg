<svg viewBox="0 0 1000 500" width="1000" height="500" xmlns="http://www.w3.org/2000/svg">
    <rect width="1000" height="500" fill="#ffffff" />

    <!-- SECTION 1: HTTP (Top Half) -->
    <text x="500" y="50" font-family="'Khmer OS Siemreap', Arial, sans-serif" fill="#000000" font-weight="bold" font-size="24" text-anchor="middle" text-decoration="underline">HTTP (គ្មានសុវត្ថិភាព / Unsecured)</text>
    
    <rect x="100" y="80" width="180" height="90" fill="#ffffff" stroke="#000000" stroke-width="3" rx="8" />
    <text x="190" y="120" font-family="'Khmer OS Siemreap', Arial, sans-serif" fill="#000000" font-weight="bold" font-size="20" text-anchor="middle">Client</text>
    <text x="190" y="145" font-family="'Khmer OS Siemreap', Arial, sans-serif" fill="#333333" font-size="16" text-anchor="middle">Web Browser</text>

    <rect x="720" y="80" width="180" height="90" fill="#ffffff" stroke="#000000" stroke-width="3" rx="8" />
    <text x="810" y="120" font-family="'Khmer OS Siemreap', Arial, sans-serif" fill="#000000" font-weight="bold" font-size="20" text-anchor="middle">Server</text>
    <text x="810" y="145" font-family="'Khmer OS Siemreap', Arial, sans-serif" fill="#333333" font-size="16" text-anchor="middle">Web Server</text>

    <!-- Manual Arrow HTTP -->
    <line x1="280" y1="125" x2="710" y2="125" stroke="#000000" stroke-width="3" />
    <polygon points="710,120 720,125 710,130" fill="#000000" />
    
    <!-- Data packet over HTTP -->
    <rect x="420" y="90" width="160" height="30" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="500" y="112" font-family="'Khmer OS Siemreap', Arial, sans-serif" fill="#333333" font-size="16" text-anchor="middle">Plain Text (លេខសម្ងាត់)</text>

    <!-- Hacker Interception -->
    <rect x="420" y="160" width="160" height="60" fill="#f9f9f9" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" rx="4" />
    <text x="500" y="185" font-family="'Khmer OS Siemreap', Arial, sans-serif" fill="#000000" font-weight="bold" font-size="16" text-anchor="middle">Hacker</text>
    <text x="500" y="205" font-family="'Khmer OS Siemreap', Arial, sans-serif" fill="#333333" font-size="14" text-anchor="middle">(អាចលួចអានទិន្នន័យបាន)</text>
    
    <!-- Manual Intercept Arrow -->
    <line x1="500" y1="125" x2="500" y2="150" stroke="#000000" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="495,150 500,160 505,150" fill="#000000" />

    <!-- Divider -->
    <line x1="50" y1="250" x2="950" y2="250" stroke="#cccccc" stroke-width="2" stroke-dasharray="10,10" />

    <!-- SECTION 2: HTTPS (Bottom Half) -->
    <text x="500" y="300" font-family="'Khmer OS Siemreap', Arial, sans-serif" fill="#000000" font-weight="bold" font-size="24" text-anchor="middle" text-decoration="underline">HTTPS (សុវត្ថិភាពខ្ពស់ / Encrypted)</text>
    
    <rect x="100" y="330" width="180" height="90" fill="#ffffff" stroke="#000000" stroke-width="3" rx="8" />
    <text x="190" y="370" font-family="'Khmer OS Siemreap', Arial, sans-serif" fill="#000000" font-weight="bold" font-size="20" text-anchor="middle">Client</text>
    <text x="190" y="395" font-family="'Khmer OS Siemreap', Arial, sans-serif" fill="#333333" font-size="16" text-anchor="middle">Web Browser</text>

    <rect x="720" y="330" width="180" height="90" fill="#ffffff" stroke="#000000" stroke-width="3" rx="8" />
    <text x="810" y="370" font-family="'Khmer OS Siemreap', Arial, sans-serif" fill="#000000" font-weight="bold" font-size="20" text-anchor="middle">Server</text>
    <text x="810" y="395" font-family="'Khmer OS Siemreap', Arial, sans-serif" fill="#333333" font-size="16" text-anchor="middle">Web Server</text>

    <!-- Manual Arrow HTTPS -->
    <line x1="280" y1="375" x2="710" y2="375" stroke="#000000" stroke-width="3" />
    <polygon points="710,370 720,375 710,380" fill="#000000" />
    
    <!-- Data packet over HTTPS -->
    <rect x="380" y="340" width="240" height="30" fill="#333333" />
    <text x="500" y="362" font-family="'Khmer OS Siemreap', Arial, sans-serif" fill="#ffffff" font-size="16" text-anchor="middle">Encrypted Text (*&^%$#@!)</text>

    <!-- SSL Lock Text (No Emojis) -->
    <text x="500" y="395" font-family="'Khmer OS Siemreap', Arial, sans-serif" fill="#000000" font-weight="bold" font-size="16" text-anchor="middle">SSL/TLS Encryption</text>

    <!-- Hacker Interception Blocked -->
    <rect x="420" y="420" width="160" height="60" fill="#f9f9f9" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" rx="4" />
    <text x="500" y="445" font-family="'Khmer OS Siemreap', Arial, sans-serif" fill="#000000" font-weight="bold" font-size="16" text-anchor="middle">Hacker</text>
    <text x="500" y="465" font-family="'Khmer OS Siemreap', Arial, sans-serif" fill="#333333" font-size="14" text-anchor="middle">(មិនអាចអានទិន្នន័យបាន)</text>
    
    <!-- Manual Intercept Arrow Blocked -->
    <line x1="500" y1="375" x2="500" y2="420" stroke="#000000" stroke-width="3" stroke-dasharray="4,4" />
    
    <!-- Big X to show blocked -->
    <line x1="490" y1="410" x2="510" y2="430" stroke="#000000" stroke-width="4" />
    <line x1="510" y1="410" x2="490" y2="430" stroke="#000000" stroke-width="4" />

</svg>