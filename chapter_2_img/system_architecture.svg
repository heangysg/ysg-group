<svg viewBox="0 0 1100 600" width="1100" height="600" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
    <g transform="translate(50, 50)">
        <text x="450" y="40" font-family="Arial" font-size="32" font-weight="bold" fill="#000000" text-anchor="middle">System Architecture (Tech Stack)</text>

        <rect x="50" y="100" width="260" height="360" rx="15" fill="#ffffff" stroke="#000000" stroke-width="3"/>
        <text x="180" y="140" font-family="Arial" font-size="26" font-weight="bold" fill="#000000" text-anchor="middle">Front-End</text>
        <rect x="80" y="180" width="200" height="80" rx="10" fill="#ffffff" stroke="#000000" stroke-width="3"/>
        <text x="180" y="230" font-family="Arial" font-size="24" font-weight="bold" fill="#000000" text-anchor="middle">Next.js / React</text>
        <rect x="80" y="300" width="200" height="80" rx="10" fill="#ffffff" stroke="#000000" stroke-width="3"/>
        <text x="180" y="350" font-family="Arial" font-size="24" font-weight="bold" fill="#000000" text-anchor="middle">Tailwind CSS</text>
        <path d="M 310 280 L 430 280" fill="none" stroke="#000000" stroke-width="3" stroke-dasharray="8,8" marker-end="url(#arrow)"/>
        <path d="M 430 240 L 310 240" fill="none" stroke="#000000" stroke-width="3" stroke-dasharray="8,8" marker-end="url(#arrow)"/>
        <text x="370" y="210" font-family="Arial" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">RESTful API</text>
        <text x="370" y="320" font-family="Arial" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">(JSON)</text>
        <rect x="430" y="100" width="260" height="360" rx="15" fill="#ffffff" stroke="#000000" stroke-width="3"/>
        <text x="560" y="140" font-family="Arial" font-size="26" font-weight="bold" fill="#000000" text-anchor="middle">Back-End</text>
        <rect x="460" y="240" width="200" height="80" rx="10" fill="#ffffff" stroke="#000000" stroke-width="3"/>
        <text x="560" y="290" font-family="Arial" font-size="24" font-weight="bold" fill="#000000" text-anchor="middle">Express.js</text>
        <path d="M 690 280 L 780 280" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#arrow)"/>
        <path d="M 780 240 L 690 240" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#arrow)"/>
        <rect x="780" y="100" width="180" height="360" rx="15" fill="#ffffff" stroke="#000000" stroke-width="3"/>
        <text x="870" y="140" font-family="Arial" font-size="26" font-weight="bold" fill="#000000" text-anchor="middle">Database</text>
        <path d="M 800 240 C 800 220, 940 220, 940 240 L 940 320 C 940 340, 800 340, 800 320 Z" fill="#ffffff" stroke="#000000" stroke-width="3"/>
        <path d="M 800 240 C 800 260, 940 260, 940 240" fill="none" stroke="#000000" stroke-width="3"/>
        <text x="870" y="290" font-family="Arial" font-size="20" font-weight="bold" fill="#000000" text-anchor="middle">PostgreSQL</text>
    </g>
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
        </marker>
    </defs>
</svg>