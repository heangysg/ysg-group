<svg width="1000" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
    
  <style>
    text { font-family: 'Khmer OS Siemreap', Arial, sans-serif; fill: #000000; }
    .subtitle { font-size: 16px; fill: #333333; }
    .box { fill: #ffffff; stroke: #333333; stroke-width: 2; rx: 6; }
    .box-header { font-weight: bold; font-size: 18px; fill: #ffffff; }
    .arrow { stroke: #000000; stroke-width: 3; fill: none; }
    .arrow-head { fill: #000000; }
    .code { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #000000; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow-head" />
    </marker>
  </defs>

    <rect width="1000" height="500" fill="#ffffff" />

    <rect x="50" y="150" width="220" height="180" class="box" />
    <rect x="50" y="150" width="220" height="50" fill="#333333" rx="6" />
    <text x="160" y="182" text-anchor="middle" class="box-header">Web Browser</text>
    <text x="160" y="250" text-anchor="middle" class="code" style="font-size:18px;">www.ysg.com</text>

    <path d="M 270 240 L 410 240" class="arrow" marker-end="url(#arrowhead)" />
    <text x="340" y="225" text-anchor="middle" class="subtitle">DNS Lookup</text>

    <rect x="430" y="150" width="220" height="180" class="box" />
    <rect x="430" y="150" width="220" height="50" fill="#666666" rx="6" />
    <text x="540" y="182" text-anchor="middle" class="box-header">DNS Server</text>
    <text x="540" y="250" text-anchor="middle" class="code" style="font-size:18px;">IP: 76.76.21.21</text>

    <path d="M 650 240 L 730 240" class="arrow" marker-end="url(#arrowhead)" />
    <text x="690" y="225" text-anchor="middle" class="subtitle">HTTP</text>

    <rect x="750" y="100" width="220" height="280" class="box" />
    <rect x="750" y="100" width="220" height="50" fill="#000000" rx="6" />
    <text x="860" y="132" text-anchor="middle" class="box-header">Cloud Hosting</text>
    <text x="860" y="210" text-anchor="middle" class="subtitle">Web Server</text>
    <text x="860" y="250" text-anchor="middle" class="subtitle">(Vercel)</text>
    
    <rect x="780" y="290" width="160" height="50" fill="#cccccc" rx="6" />
    <text x="860" y="322" text-anchor="middle" class="subtitle">Website Files</text>
  </svg>