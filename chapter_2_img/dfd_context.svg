<svg viewBox="0 0 900 600" width="900" height="600" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>
    <g transform="translate(50, 50)">
        <text x="400" y="40" font-family="Arial" font-size="32" font-weight="bold" fill="#000000" text-anchor="middle">Context Diagram (Level 0)</text>
        <ellipse cx="400" cy="250" rx="140" ry="90" fill="#ffffff" stroke="#000000" stroke-width="3"/>
        <text x="400" y="240" font-family="Arial" font-size="26" font-weight="bold" fill="#000000" text-anchor="middle">YSG Sales</text>
        <text x="400" y="275" font-family="Arial" font-size="26" font-weight="bold" fill="#000000" text-anchor="middle">System</text>
        <rect x="50" y="210" width="140" height="80" fill="#ffffff" stroke="#000000" stroke-width="3"/>
        <text x="120" y="258" font-family="Arial" font-size="24" font-weight="bold" fill="#000000" text-anchor="middle">Customer</text>
        <rect x="610" y="210" width="140" height="80" fill="#ffffff" stroke="#000000" stroke-width="3"/>
        <text x="680" y="258" font-family="Arial" font-size="24" font-weight="bold" fill="#000000" text-anchor="middle">Admin</text>
        <path d="M 190 230 L 260 230" fill="none" stroke="#000000" stroke-width="3" marker-end="url(#arrow)"/>
