<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg">
    
  <style>
    text { font-family: 'Khmer OS Siemreap', Arial, sans-serif; fill: #000000; }
    .subtitle { font-size: 16px; fill: #333333; }
    .box { fill: #ffffff; stroke: #333333; stroke-width: 2; rx: 6; }
    .box-header { font-weight: bold; font-size: 18px; fill: #ffffff; }
    .arrow { stroke: #000000; stroke-width: 3; fill: none; }
    .arrow-head { fill: #000000; }
    .code { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #000000; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow-head" />
    </marker>
  </defs>

    <rect width="1000" height="400" fill="#ffffff" />
    
    <rect x="100" y="100" width="400" height="200" class="box" />
    <rect x="100" y="100" width="400" height="50" fill="#333333" rx="6" />
    <text x="300" y="132" text-anchor="middle" class="box-header">SQL Query Editor</text>
    <text x="300" y="190" text-anchor="middle" class="code" style="font-size:18px;">SELECT * FROM machines</text>
    <text x="300" y="230" text-anchor="middle" class="code" style="font-size:18px;">WHERE stock > 0;</text>

    <path d="M 500 200 L 730 200" class="arrow" marker-end="url(#arrowhead)" />
    <text x="615" y="180" text-anchor="middle" class="subtitle" style="font-size:20px; font-weight:bold;">Execute</text>

    <rect x="750" y="120" width="150" height="150" rx="15" fill="#f3f4f6" stroke="#333333" stroke-width="3" />
    <text x="825" y="205" text-anchor="middle" class="title" style="font-weight:bold; font-size:24px">Data</text>
  </svg>