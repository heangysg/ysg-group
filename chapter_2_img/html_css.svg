<svg width="1000" height="500" viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
    
  <style>
    text { font-family: 'Khmer OS Siemreap', Arial, sans-serif; fill: #000000; }
    .subtitle { font-size: 16px; fill: #333333; }
    .box { fill: #ffffff; stroke: #333333; stroke-width: 2; rx: 6; }
    .box-header { font-weight: bold; font-size: 18px; fill: #ffffff; }
    .arrow { stroke: #000000; stroke-width: 3; fill: none; }
    .arrow-head { fill: #000000; }
    .code { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #000000; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow-head" />
    </marker>
  </defs>

    <rect width="1000" height="500" fill="#ffffff" />
    
    <!-- HTML Box -->
    <rect x="50" y="100" width="250" height="280" class="box" />
    <rect x="50" y="100" width="250" height="50" fill="#333333" rx="6" />
    <text x="175" y="132" text-anchor="middle" class="box-header">HTML (Structure)</text>
    <text x="75" y="200" class="code">&lt;div class="btn"&gt;</text>
    <text x="105" y="240" class="code">Buy Machine</text>
    <text x="75" y="280" class="code">&lt;/div&gt;</text>
    
    <!-- Plus -->
    <text x="350" y="260" text-anchor="middle" style="font-size: 50px; font-weight: bold;">+</text>

    <!-- CSS Box -->
    <rect x="400" y="100" width="250" height="280" class="box" />
    <rect x="400" y="100" width="250" height="50" fill="#333333" rx="6" />
    <text x="525" y="132" text-anchor="middle" class="box-header">CSS (Style)</text>
    <text x="425" y="200" class="code">.btn {</text>
    <text x="445" y="240" class="code">background: black;</text>
    <text x="445" y="280" class="code">color: white;</text>
    <text x="425" y="320" class="code">}</text>

    <!-- Equals -->
    <text x="700" y="260" text-anchor="middle" style="font-size: 50px; font-weight: bold;">=</text>

    <!-- Result Webpage -->
    <rect x="750" y="100" width="200" height="280" class="box" />
    <rect x="750" y="100" width="200" height="50" fill="#666666" rx="6" />
    <text x="850" y="132" text-anchor="middle" class="box-header">Web Browser</text>
    <rect x="775" y="200" width="150" height="60" fill="#000000" rx="8" />
    <text x="850" y="235" text-anchor="middle" style="fill: #ffffff; font-weight: bold; font-size: 16px;">Buy Machine</text>
  </svg>