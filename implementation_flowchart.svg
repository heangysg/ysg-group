<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <!-- Definitions for arrowheads -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b" />
    </marker>
  </defs>

  <!-- Background (Optional, good for copying) -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <style>
    .box { fill: #f8fafc; stroke: #3b82f6; stroke-width: 2.5; rx: 6; ry: 6; }
    .text { font-family: 'Khmer OS Siemreap', 'Khmer OS Battambang', 'Hanuman', sans-serif; font-size: 18px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
    .line { stroke: #1e293b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>

  <!-- Step 1 -->
  <rect x="50" y="30" width="500" height="60" class="box" />
  <text x="300" y="62" class="text">ការដំឡើងកម្មវិធីចាំបាច់សម្រាប់បង្កើតប្រព័ន្ធ</text>

  <!-- Arrow 1 -->
  <line x1="300" y1="90" x2="300" y2="125" class="line" />

  <!-- Step 2 -->
  <rect x="50" y="130" width="500" height="60" class="box" />
  <text x="300" y="162" class="text">រចនាចំណុចប្រទាក់</text>

  <!-- Arrow 2 -->
  <line x1="300" y1="190" x2="300" y2="225" class="line" />

  <!-- Step 3 -->
  <rect x="50" y="230" width="500" height="60" class="box" />
  <text x="300" y="262" class="text">ការសរសេរកូដ</text>

  <!-- Arrow 3 -->
  <line x1="300" y1="290" x2="300" y2="325" class="line" />

  <!-- Step 4 -->
  <rect x="50" y="330" width="500" height="60" class="box" />
  <text x="300" y="362" class="text">ការសាកល្បង និង កែប្រែកំហុស</text>
</svg>
