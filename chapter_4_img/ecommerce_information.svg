<svg width="600" height="500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .box { fill: #ffffff; stroke: #000000; stroke-width: 2px; rx: 8px; }
            .center-box { fill: #f0f0f0; stroke: #000000; stroke-width: 3px; rx: 12px; }
            .text-main { font-family: 'Khmer OS Siemreap', sans-serif; font-size: 18px; fill: #000; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
            .text-sub { font-family: 'Khmer OS Siemreap', sans-serif; font-size: 15px; fill: #000; text-anchor: middle; dominant-baseline: middle; }
            .line { stroke: #000000; stroke-width: 2px; fill: none; }
        </style>
    </defs>
    
    <!-- Background -->
    <rect width="100%" height="100%" fill="#ffffff" />
    
    <!-- Lines connecting center to outer boxes -->
    <!-- Top to Center -->
    <path d="M 300 110 L 300 200" class="line" />
    <!-- Bottom to Center -->
    <path d="M 300 280 L 300 370" class="line" />
    <!-- Left to Center -->
    <path d="M 150 240 L 200 240" class="line" />
    <!-- Right to Center -->
    <path d="M 400 240 L 450 240" class="line" />

    <!-- Center Box -->
    <rect x="200" y="200" width="200" height="80" class="center-box" />
    <text x="300" y="240" class="text-main">ប្រព័ន្ធ E-Commerce</text>

    <!-- Top Box: Sales & Orders -->
    <rect x="200" y="50" width="200" height="60" class="box" />
    <text x="300" y="80" class="text-sub">ផ្នែកលក់ និងបញ្ជាទិញ</text>

    <!-- Bottom Box: Reporting -->
    <rect x="200" y="370" width="200" height="60" class="box" />
    <text x="300" y="400" class="text-sub">ផ្នែករបាយការណ៍</text>

    <!-- Left Box: Payment -->
    <rect x="20" y="210" width="130" height="60" class="box" />
    <text x="85" y="240" class="text-sub">ផ្នែកទូទាត់ប្រាក់</text>

    <!-- Right Box: Stock -->
    <rect x="450" y="210" width="130" height="60" class="box" />
    <text x="515" y="240" class="text-sub">គ្រប់គ្រងស្តុក</text>

</svg>
