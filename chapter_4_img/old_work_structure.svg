<svg width="600" height="600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#000" />
        </marker>
        <style>
            .box { fill: #fff; stroke: #000; stroke-width: 2px; rx: 8px; }
            .text { font-family: 'Khmer OS Siemreap', sans-serif; font-size: 16px; fill: #000; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
            .label { font-family: 'Khmer OS Siemreap', sans-serif; font-size: 14px; fill: #000; text-anchor: middle; }
            .bg-rect { fill: white; }
            .line { stroke: #000; stroke-width: 2px; fill: none; marker-end: url(#arrow); }
        </style>
    </defs>
    
    <!-- Background -->
    <rect width="100%" height="100%" fill="#ffffff" />
    
    <!-- Nodes -->
    <!-- Customer -->
    <rect x="120" y="50" width="160" height="60" class="box" />
    <text x="200" y="80" class="text">អតិថិជន</text>

    <!-- Sales Staff -->
    <rect x="120" y="220" width="160" height="60" class="box" />
    <text x="200" y="250" class="text">បុគ្គលិកផ្នែកលក់</text>

    <!-- Warehouse -->
    <rect x="380" y="220" width="160" height="60" class="box" />
    <text x="460" y="250" class="text">ឃ្លាំងផ្ទុកទំនិញ</text>

    <!-- Manual Record -->
    <rect x="120" y="390" width="160" height="60" class="box" />
    <text x="200" y="420" class="text">កត់ត្រាក្នុងសៀវភៅ</text>

    <!-- Manager -->
    <rect x="120" y="520" width="160" height="60" class="box" />
    <text x="200" y="550" class="text">អ្នកគ្រប់គ្រង</text>

    <!-- Connections -->
    <!-- Customer to Sales -->
    <path d="M 200 110 L 200 210" class="line" />
    <rect x="160" y="150" width="80" height="24" class="bg-rect" />
    <text x="200" y="162" class="label">បញ្ជាទិញ</text>

    <!-- Sales to Warehouse -->
    <path d="M 280 250 L 370 250" class="line" />
    <rect x="290" y="220" width="70" height="24" class="bg-rect" />
    <text x="325" y="232" class="label">ពិនិត្យស្តុក</text>

    <!-- Warehouse to Customer -->
    <path d="M 460 220 L 460 80 L 290 80" class="line" />
    <rect x="340" y="68" width="80" height="24" class="bg-rect" />
    <text x="380" y="80" class="label">ប្រគល់ទំនិញ</text>

    <!-- Sales to Manual Record -->
    <path d="M 200 280 L 200 380" class="line" />
    <rect x="150" y="318" width="100" height="24" class="bg-rect" />
    <text x="200" y="330" class="label">កត់វិក្កយបត្រដៃ</text>

    <!-- Manual Record to Manager -->
    <path d="M 200 450 L 200 510" class="line" />
    <rect x="150" y="468" width="100" height="24" class="bg-rect" />
    <text x="200" y="480" class="label">របាយការណ៍ខែ</text>

</svg>
