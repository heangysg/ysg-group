<svg width="700" height="600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L0,6 L9,3 z" fill="#000" />
        </marker>
        <style>
            .box { fill: #fff; stroke: #000; stroke-width: 2px; rx: 4px; }
            .circle { fill: #fff; stroke: #000; stroke-width: 2px; }
            .text { font-family: 'Khmer OS Siemreap', sans-serif; font-size: 16px; fill: #000; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
            .text-small { font-family: 'Khmer OS Siemreap', sans-serif; font-size: 14px; fill: #000; font-weight: normal; text-anchor: middle; dominant-baseline: middle; }
            .label { font-family: 'Khmer OS Siemreap', sans-serif; font-size: 13px; fill: #000; text-anchor: middle; }
            .bg-rect { fill: white; }
            .line { stroke: #000; stroke-width: 2px; fill: none; marker-end: url(#arrow); }
        </style>
    </defs>
    
    <!-- Background -->
    <rect width="100%" height="100%" fill="#ffffff" />
    
    <!-- Process Node (Center Circle) -->
    <circle cx="350" cy="300" r="85" class="circle" />
    <line x1="278" y1="250" x2="422" y2="250" stroke="#000" stroke-width="2" />
    <text x="350" y="235" class="text">០</text>
    <text x="350" y="285" class="text">ប្រព័ន្ធ E-Commerce</text>
    <text x="350" y="315" class="text-small">និងគ្រប់គ្រងស្តុកថ្មី</text>
    <text x="350" y="350" class="text-small">(New System)</text>

    <!-- External Entities -->
    <!-- Customer -->
    <rect x="20" y="270" width="110" height="60" class="box" />
    <text x="75" y="300" class="text">អតិថិជន</text>

    <!-- Admin -->
    <rect x="570" y="270" width="110" height="60" class="box" />
    <text x="625" y="300" class="text">អ្នកគ្រប់គ្រង</text>

    <!-- Bakong -->
    <rect x="295" y="490" width="110" height="60" class="box" />
    <text x="350" y="520" class="text">ប្រព័ន្ធបាគង</text>

    <!-- Connections -->
    <!-- Customer to Process -->
    <path d="M 130 280 L 260 280" class="line" />
    <rect x="155" y="255" width="80" height="20" class="bg-rect" />
    <text x="195" y="270" class="label">បញ្ជាទិញទំនិញ</text>

    <!-- Process to Customer -->
    <path d="M 260 320 L 130 320" class="line" />
    <rect x="145" y="335" width="100" height="20" class="bg-rect" />
    <text x="195" y="350" class="label">វិក្កយបត្រឌីជីថល</text>

    <!-- Admin to Process -->
    <path d="M 570 280 L 440 280" class="line" />
    <rect x="460" y="255" width="90" height="20" class="bg-rect" />
    <text x="505" y="270" class="label">គ្រប់គ្រងទិន្នន័យ</text>

    <!-- Process to Admin -->
    <path d="M 440 320 L 570 320" class="line" />
    <rect x="450" y="335" width="110" height="20" class="bg-rect" />
    <text x="505" y="350" class="label">របាយការណ៍/កម្មង់</text>

    <!-- Process to Bakong -->
    <path d="M 330 385 L 330 485" class="line" />
    <rect x="250" y="425" width="75" height="20" class="bg-rect" />
    <text x="285" y="440" class="label">ស្នើសុំទូទាត់</text>

    <!-- Bakong to Process -->
    <path d="M 370 485 L 370 385" class="line" />
    <rect x="375" y="425" width="90" height="20" class="bg-rect" />
    <text x="420" y="440" class="label">ស្ថានភាពទូទាត់</text>

</svg>
