<svg width="750" height="500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .box { fill: #fff; stroke: #000; stroke-width: 2px; rx: 4px; }
            .box-feature { fill: #f9f9f9; stroke: #000; stroke-width: 1px; rx: 4px; }
            .text-title { font-family: 'Khmer OS Siemreap', sans-serif; font-size: 18px; fill: #000; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
            .text-header { font-family: 'Khmer OS Siemreap', sans-serif; font-size: 16px; fill: #000; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
            .text-list { font-family: 'Khmer OS Siemreap', sans-serif; font-size: 14px; fill: #000; text-anchor: start; dominant-baseline: middle; }
            .line { stroke: #000; stroke-width: 2px; fill: none; }
        </style>
    </defs>
    
    <!-- Background -->
    <rect width="100%" height="100%" fill="#ffffff" />
    
    <!-- Title Node -->
    <rect x="250" y="30" width="250" height="60" class="box" />
    <text x="375" y="60" class="text-title">ប្រព័ន្ធ E-Commerce ថ្មី</text>

    <!-- Connecting Lines from Title to Roles -->
    <path d="M 375 90 L 375 115" class="line" />
    <path d="M 150 115 L 600 115" class="line" />
    <path d="M 150 115 L 150 140" class="line" />
    <path d="M 375 115 L 375 140" class="line" />
    <path d="M 600 115 L 600 140" class="line" />

    <!-- Role 1: Super Admin -->
    <rect x="40" y="140" width="220" height="50" class="box" />
    <text x="150" y="165" class="text-header">Super Admin</text>
    <rect x="40" y="190" width="220" height="170" class="box-feature" />
    <!-- Role 1 Features -->
    <circle cx="55" cy="225" r="3" fill="#000" />
    <text x="65" y="225" class="text-list">គ្រប់គ្រងប្រព័ន្ធទាំងមូល</text>
    
    <circle cx="55" cy="265" r="3" fill="#000" />
    <text x="65" y="265" class="text-list">បន្ថែមបុគ្គលិកថ្មី</text>
    
    <circle cx="55" cy="305" r="3" fill="#000" />
    <text x="65" y="305" class="text-list">កំណត់សិទ្ធិប្រើប្រាស់</text>
    
    <circle cx="55" cy="345" r="3" fill="#000" />
    <text x="65" y="345" class="text-list">ការកំណត់ទូទៅ</text>

    <!-- Role 2: Admin / Staff -->
    <rect x="265" y="140" width="220" height="50" class="box" />
    <text x="375" y="165" class="text-header">Admin / Staff</text>
    <rect x="265" y="190" width="220" height="170" class="box-feature" />
    <!-- Role 2 Features -->
    <circle cx="280" cy="225" r="3" fill="#000" />
    <text x="290" y="225" class="text-list">គ្រប់គ្រងបញ្ជីផលិតផល</text>
    
    <circle cx="280" cy="265" r="3" fill="#000" />
    <text x="290" y="265" class="text-list">ពិនិត្យការបញ្ជាទិញ</text>
    
    <circle cx="280" cy="305" r="3" fill="#000" />
    <text x="290" y="305" class="text-list">គ្រប់គ្រងស្តុកស្វ័យប្រវត្តិ</text>
    
    <circle cx="280" cy="345" r="3" fill="#000" />
    <text x="290" y="345" class="text-list">ឆ្លើយតបសារអតិថិជន</text>

    <!-- Role 3: Customer -->
    <rect x="490" y="140" width="220" height="50" class="box" />
    <text x="600" y="165" class="text-header">Customer</text>
    <rect x="490" y="190" width="220" height="170" class="box-feature" />
    <!-- Role 3 Features -->
    <circle cx="505" cy="225" r="3" fill="#000" />
    <text x="515" y="225" class="text-list">ស្វែងរកទំនិញ</text>
    
    <circle cx="505" cy="265" r="3" fill="#000" />
    <text x="515" y="265" class="text-list">បន្ថែមចូលកន្ត្រក</text>
    
    <circle cx="505" cy="305" r="3" fill="#000" />
    <text x="515" y="305" class="text-list">ទូទាត់ប្រាក់ (Bakong)</text>
    
    <circle cx="505" cy="345" r="3" fill="#000" />
    <text x="515" y="345" class="text-list">តាមដានការដឹកជញ្ជូន</text>

</svg>
